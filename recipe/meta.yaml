{% set version = "0.8.1" %}
# Latest python_min is defined in https://github.com/conda-forge/conda-forge-pinning-feedstock/blob/main/recipe/conda_build_config.yaml

package:
  name: class-resolver
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/class-resolver/class_resolver-{{ version }}.tar.gz
  sha256: eae529e7eb620973b13b88f36e198479e3b28dc8f0297ea0c8ecdc78d9a962b0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - uv-build >=0.12.17,<1.0
  run:
    - python >={{ python_min }}
    - typing_extensions

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - class_resolver
  commands:
    - pip check

about:
  home: https://github.com/cthoyt/class-resolver
  summary: Lookup and instantiate classes with style.
  license: MIT
  license_file: LICENSE
  doc_url: https://class-resolver.readthedocs.io
  dev_url: https://github.com/cthoyt/class-resolver

extra:
  recipe-maintainers:
    - jamesmyatt
